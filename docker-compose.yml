services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: luxtickets-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/src/LuxTickets.Api/Dockerfile
    container_name: luxtickets-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=LuxTickets;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-8088}"
    ports:
      - "${API_PORT:-5080}:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: luxtickets-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  mssql-data:
