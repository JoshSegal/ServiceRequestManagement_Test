name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build · format · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/LuxTickets.slnx
      - name: Build (warnings as errors)
        run: dotnet build backend/LuxTickets.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test backend/tests/LuxTickets.UnitTests/LuxTickets.UnitTests.csproj -c Release --no-build
      - name: Integration tests (Testcontainers → SQL Server)
        run: dotnet test backend/tests/LuxTickets.IntegrationTests/LuxTickets.IntegrationTests.csproj -c Release --no-build

  frontend:
    name: Frontend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build (production)
        run: npm run build
      - name: Unit tests
        run: npm test -- --no-watch
